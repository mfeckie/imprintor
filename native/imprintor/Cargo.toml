[package]
  name = "imprintor"
  version = "0.1.0"
  authors = []
  edition = "2021"

[lib]
  name = "imprintor"
  crate-type = ["cdylib"]

[dependencies]
  rustler = { version = "0.38.0", default-features = false, features = [
    "derive",
  ] }
  typst = "0.15.1"
  typst-kit = { version = "0.15.1", default-features = false, features = [
    "embedded-fonts",
    "scan-fonts",
  ] }
  typst-pdf = "0.15.1"
  typst-layout = "0.15.1"
  typst-render = "0.15.1"
  time = "0.3.55"
  serde_json = "1.0.154"
  ureq = "3.5.1"
  tar = "0.4.46"
  zune-inflate = "0.2.54"

[dev-dependencies]
  # Same version Typst uses, so tests can check eviction against real memoization.
  comemo = "0.5.1"

[features]
  default = ["nif_version_2_16"]
  nif_version_2_16 = ["rustler/nif_version_2_16"]
  nif_version_2_17 = ["rustler/nif_version_2_17"]
  nif_version_2_18 = ["rustler/nif_version_2_18"]
